name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test
      env:
        CI: true
        BASE_URL: https://samecommers.netlify.app/
        REAL_USER_NAME: ${{ secrets.REAL_USER_NAME || 'Jane Customer' }}
        REAL_USER_EMAIL: ${{ secrets.REAL_USER_EMAIL || 'customer@practicesoftwaretesting.com' }}
        REAL_USER_PASSWORD: ${{ secrets.REAL_USER_PASSWORD || 'User01' }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@practicesoftwaretesting.com' }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Sampath@123' }}

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
